version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      abp:
        patterns:
          - "Volo.Abp.*"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
    ignore:
      # Pinned to ABP Framework 10.7.0 - do not bump Volo.Abp.* to 10.8.0+.
      - dependency-name: "Volo.Abp.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Its own version line (2.x/3.x) is decoupled from the ABP core version it requires:
      # Volo.Abp.Studio.Client.AspNetCore 3.1.4 requires Volo.Abp.AspNetCore >= 10.6.1 (fine on 10.7.0),
      # but a later 3.1.x may silently require a newer ABP - dependabot classifies e.g. 3.1.4->3.1.6 as a
      # same-line patch update, so the semver-based ignore above doesn't catch it (confirmed in abp-modules).
      - dependency-name: "Volo.Abp.Studio.Client.AspNetCore"
        versions: [">= 3.1.5"]
      # Volo.Abp.Swashbuckle 10.7.0 pulls in Swashbuckle.AspNetCore, whose Swashbuckle.AspNetCore.Swagger
      # sub-package is compiled against Microsoft.OpenApi 2.x (floor 2.3.0). 3.x is a breaking rewrite
      # Swashbuckle hasn't picked up yet, so a 3.x bump would resolve fine on paper but break Swagger
      # generation at runtime (confirmed in abp-modules).
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.0.0"]
      # ── Held groups. Each needs verification a package-graph resolution cannot give, so they
      #    are worked through their issue rather than proposed automatically. Lift the entry when
      #    the issue closes; do not lift one member of a group on its own.
      #
      # MCP egress (#611). ModelContextProtocol.AspNetCore backs the MCP server, one of the three
      # live egress channels. A major changes protocol/transport behaviour that a green build and
      # our inputSchema + authorization tests do not reach - no test here speaks to a real client
      # handshake, and the deployed instance is reached by real MCP clients. 1.x patches still flow.
      - dependency-name: "ModelContextProtocol"
        versions: [">= 2.0.0"]
      - dependency-name: "ModelContextProtocol.AspNetCore"
        versions: [">= 2.0.0"]
      #
      # Text extraction (#612). PdfPig / DocumentFormat.OpenXml / ClosedXML are pinned to the exact
      # versions ElBruno.MarkItDotNet 0.6.0 pulls transitively, so the host resolves a single copy of
      # each and the two extraction providers cannot conflict (see the comments beside those pins in
      # Directory.Packages.props). Any independent bump makes the pin describe a version nothing
      # justifies, so all five are held together - not just majors, since MarkItDotNet is pre-1.0 and
      # its minors carry the conversion-behaviour changes. Failures here are wrong Markdown, not
      # exceptions, which nothing in CI would catch.
      - dependency-name: "ElBruno.MarkItDotNet"
        versions: [">= 0.6.1"]
      - dependency-name: "ElBruno.MarkItDotNet.Excel"
        versions: [">= 0.6.1"]
      - dependency-name: "PdfPig"
        versions: [">= 0.1.15"]
      - dependency-name: "DocumentFormat.OpenXml"
        versions: [">= 3.3.1"]
      - dependency-name: "ClosedXML"
        versions: [">= 0.105.1"]
      #
      # PDF rasterisation (#613). SkiaSharp.NativeAssets.Linux must match the SkiaSharp version
      # PDFtoImage pulls in, exactly - the managed assembly loads the native library by version.
      # Dependabot got this pair wrong once already: it proposed PDFtoImage 5.4.0 (which resolves
      # SkiaSharp to 4.150.1) alongside native assets 4.151.2. A mismatch surfaces only when the
      # Linux container loads native assets, so neither the build nor any unit test sees it.
      - dependency-name: "PDFtoImage"
        versions: [">= 5.2.2"]
      - dependency-name: "SkiaSharp.NativeAssets.Linux"
        versions: [">= 3.119.3"]

  - package-ecosystem: npm
    directory: "/angular"
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      abp-ng:
        patterns:
          - "@abp/*"
      others:
        patterns:
          - "*"
    ignore:
      # ABP 10.7.0 pairs with Angular 22; Angular 23 will be a later ABP line's version. 22.x
      # patch/minor bumps still flow through normally.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # ng-packagr and angular-eslint aren't under the @angular/* scope but their major version
      # tracks Angular's own (confirmed as a gap in abp-modules - ng-packagr 22.x pairs with
      # Angular 22, and the same applies to angular-eslint's unified package here).
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript's usable range is dictated by @angular/compiler-cli, whose peer on Angular
      # 22.x is ">=6.0 <6.1". A major bump installs cleanly and then fails the library build with
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')", because the
      # Angular compiler is calling a TypeScript API that moved - npm has no way to know, since
      # typescript is not under the @angular scope. Same shape as the ng-packagr gap above;
      # observed for real when a grouped bump proposed 5.9 -> 7.0.2 (#599).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # All @abp/* packages (incl. @abp/ng.theme.lepton-x, which uses its own 5.x line) are
      # released in lockstep with the ABP Framework version - pinned at 10.7.0, don't bump to
      # whatever ships alongside 10.8.0.
      - dependency-name: "@abp/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/host/src"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "@abp/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
